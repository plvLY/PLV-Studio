<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <!-- Abstract grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="360" y1="0" x2="360" y2="810"/>
    <line x1="720" y1="0" x2="720" y2="810"/>
    <line x1="1080" y1="0" x2="1080" y2="810"/>
  </g>
  <!-- Center content -->
  <rect x="320" y="220" width="800" height="370" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Title -->
  <text x="720" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">PLV Codeatomy</text>
  <text x="720" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Code + Anatomy · 给代码库做一次解剖</text>
  <!-- Tags -->
  <g transform="translate(720, 440)">
    <rect x="-180" y="-12" width="360" height="28" rx="14" fill="url(#accent)" opacity="0.9"/>
    <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fff">E0 工程骨架已完成 · M0-M3 计划中</text>
  </g>
  <!-- Bottom info -->
  <text x="720" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Java 21 · Maven 3.9+ · Spoon 11.5.0 · SQLite · MCP SDK 2.1.0</text>
  <!-- Small corners -->
  <circle cx="380" cy="260" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="1060" cy="260" r="4" fill="#60a5fa" opacity="0.8"/>
</svg>